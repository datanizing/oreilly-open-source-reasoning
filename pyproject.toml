[project]
name = "reasoning-env"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Christian Winkler", email = "christian.winkler@datanizing.com" }
]
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.15.0",
    "causal-conv1d>=1.7.0",
    "datasets>=5.0.1",
    "flash-linear-attention>=0.5.2",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "liger-kernel[cutedsl]>=0.8.3",
    "math-verify>=0.9.0",
    "openai>=3.19.2",
    "openrouter>=1.2.22",
    "pandas>=3.0.6",
    "peft>=0.21.0",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "trl>=1.14.0",
]

[project.scripts]
reasoning-env = "reasoning_env:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
